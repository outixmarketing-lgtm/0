function validate(s){if(!s||s.version!==1)throw Error('صيغة النسخة غير مدعومة');for(const k of ['products','bundles','orders','movements','expenses'])if(!Array.isArray(s[k])||s[k].length>20000)throw Error('ملف بيانات غير صالح');const num=(n,integer=false)=>typeof n==='number'&&Number.isFinite(n)&&n>=0&&(!integer||Number.isSafeInteger(n));const str=x=>typeof x==='string'&&x.length<=2000;const validId=x=>typeof x==='string'&&/^[a-zA-Z0-9_-]{1,100}$/.test(x);const ids=new Set();for(const p of s.products){if(!validId(p.id)||ids.has(p.id)||!str(p.name)||!str(p.sku)||!str(p.english)||!Array.isArray(p.costs)||p.costs.length!==7||!p.costs.every(n=>num(n))||!num(p.stock,true)||!num(p.min,true)||!num(p.price)||typeof p.complete!=='boolean')throw Error('بيانات منتج غير صالحة');ids.add(p.id);}function components(a){return Array.isArray(a)&&a.length>0&&a.every(c=>ids.has(c.id)&&num(c.qty,true)&&c.qty>0);}const bids=new Set();for(const b of s.bundles){if(!validId(b.id)||bids.has(b.id)||!str(b.name)||!num(b.price)||!components(b.components))throw Error('باندل غير صالح');bids.add(b.id);}const oids=new Set();for(const o of s.orders){if(!validId(o.id)||oids.has(o.id)||!str(o.number)||!str(o.customer)||!str(o.phone)||!str(o.notes)||!['new','preparing','delivered','cancelled'].includes(o.status)||!Number.isFinite(Date.parse(o.date))||!num(o.total)||!num(o.paid)||o.paid>o.total||!num(o.discount)||o.discount>100||!Array.isArray(o.lines)||!o.lines.length)throw Error('طلب غير صالح');oids.add(o.id);for(const l of o.lines)if(!str(l.name)||!num(l.qty,true)||!l.qty||!num(l.price)||!num(l.cost)||!components(l.components))throw Error('بنود الطلب غير صالحة');if(Math.abs(Core.round(sum(o.lines.map(l=>l.qty*l.price))*(1-o.discount/100))-o.total)>.01)throw Error('إجمالي طلب غير مطابق');}for(const m of s.movements)if(!ids.has(m.productId)||!Number.isSafeInteger(m.qty)||!str(m.reason)||!Number.isFinite(Date.parse(m.date)))throw Error('حركة مخزون غير صالحة');for(const e of s.expenses)if(!validId(e.id)||!str(e.name)||!num(e.amount)||!Number.isFinite(Date.parse(e.date)))throw Error('مصروف غير صالح');if(s.logo&&!/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(s.logo))throw Error('صورة الشعار غير صالحة');return s;}
let state,loadError=false;try{state=localStorage.getItem(KEY)?validate(JSON.parse(localStorage.getItem(KEY))):seed();}catch(e){state=seed();loadError=true;}let showArchived=false;let page='home',calcId=state.products[0]?.id,calcData=null,toastTimer;

function chart(done){let months=Array.from({length:6},(_,i)=>{let d=new Date();d.setDate(1);d.setMonth(d.getMonth()-5+i);let key=d.getFullYear()+'-'+d.getMonth();return {label:d.toLocaleDateString('ar-EG',{month:'short'}),v:sum(done.filter(o=>{let x=new Date(o.deliveredAt||o.date);return x.getFullYear()+'-'+x.getMonth()===key}).map(o=>o.total))};});let max=Math.max(1,...months.map(m=>m.v));return `<div class="chart-bars">${months.map(m=>`<div class="chart-column"><span>${money(m.v)}</span><i style="height:${Math.max(3,m.v/max*90)}px"></i><small>${m.label}</small></div>`).join('')}</div><p style="font-size:11px">بالجنيه المصري · حسب تاريخ التسليم</p>`;}

function pricing(){let p=activeProducts().find(p=>p.id===calcId)||activeProducts()[0];if(!p)return head('حاسبة التسعير','أضف منتجًا أولًا')+`<button onclick="productForm()">إضافة منتج</button>`;calcId=p.id;return head('سعّر بثقة.','كل تكلفة محسوبة. وكل خصم واضح.')+`<div class="grid"><section class="panel"><h2>01 / المنتج وتكلفته</h2><label class="field" style="margin:20px 0">اختر المنتج<select id="calc-product" onchange="calcId=this.value;render()">${activeProducts().map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>${!p.complete?'<div class="notice warn">تكلفة هذا المنتج غير مكتملة. استكمل البنود وراجعها قبل اعتماد السعر.</div>':''}<div class="fields" id="calc-costs">${COST_LABELS.map((l,i)=>nf(l,'calc'+i,p.costs[i],'oninput="updateCalc()"')).join('')}</div><div class="item"><b>إجمالي تكلفة الوحدة</b><b id="calc-total"></b></div><h2 style="margin-top:25px">02 / طريقة التسعير</h2><div class="fields"><label class="field">احسب السعر باستخدام<select id="calc-mode" onchange="updateCalc()"><option value="markup">زيادة على التكلفة %</option><option value="margin">هامش ربح من سعر البيع %</option><option value="fixed">سعر بيع مباشر (ج.م)</option></select></label>${nf('النسبة / السعر','value',200,'id="calc-value" oninput="updateCalc()"')}${nf('خصم للعميل %','discount',0,'id="calc-discount" max="100" oninput="updateCalc()"')}</div><div class="notice" style="margin-top:20px">الزيادة على التكلفة تختلف عن هامش الربح. مثال: تكلفة 100 وسعر 300 = زيادة 200% وهامش 66.67%. وزّع مصاريف الطلب على وحداته، ولا تسجل نفس التسويق هنا وفي المصروفات مرة تانية.</div></section><div><section class="result"><div class="eyebrow" style="color:#a4bb97">YOUR NEXT SMART PRICE</div><h2>سعر البيع بعد الخصم</h2><div id="calc-result"></div><button class="lime" style="width:100%;margin-top:18px" onclick="saveCalc()">اعتماد التكلفة وسعر البيع</button><p style="font-size:11px">يُحفظ السعر النهائي بعد الخصم كسعر المنتج المعتمد.</p></section><section class="panel" style="margin-top:20px"><h3>قبل ما تعتمد السعر</h3><p>راجع الطباعة والتغليف وشحن التوريد. أضف أي تكلفة إضافية في البند المناسب، خصوصًا للمنتجات المخصصة.</p><label class="row" style="margin-top:15px;font-size:12px"><input type="checkbox" id="calc-confirm" style="width:auto" ${p.complete?'checked':''}> راجعت جميع بنود التكلفة</label></section></div></div>`;}
function updateCalc(){try{let costs=$$('#calc-costs input').map(i=>Number(i.value)),c=sum(costs);if(costs.some(n=>!Number.isFinite(n)||n<0))throw Error('التكاليف لا يمكن أن تكون سالبة');let r=Core.pricing(c,$('#calc-mode').value,+$('#calc-value').value,+$('#calc-discount').value);calcData={costs,r};$('#calc-total').textContent=egp(c);$('#calc-result').innerHTML=`<div class="price">${money(r.sale)}</div><p>جنيه مصري / وحدة</p><div class="divider"></div><div class="line"><span>قبل الخصم</span><b>${egp(r.list)}</b></div><div class="line"><span>تكلفة الوحدة</span><b>${egp(c)}</b></div><div class="line"><span>ربح الوحدة</span><b class="${r.profit<0?'bad':'ok'}">${egp(r.profit)}</b></div><div class="line"><span>هامش الربح بعد الخصم</span><b>${money(r.margin)}%</b></div><div class="line"><span>الزيادة على التكلفة</span><b>${money(r.markup)}%</b></div><div class="divider"></div><p class="${r.profit<0?'bad':''}">${r.profit<0?'تنبيه: السعر أقل من التكلفة.':r.list?'خصم التعادل من السعر الأصلي: '+money(r.breakDiscount)+'%':'أدخل سعرًا للبيع.'}</p>`;}catch(e){calcData=null;$('#calc-result').innerHTML=`<p class="bad">${esc(e.message)}</p>`;}}
function saveCalc(){if(!calcData)return toast('راجع قيم التسعير');if(!$('#calc-confirm').checked)return toast('راجع التكاليف ثم فعّل تأكيد المراجعة');if(calcData.r.profit<0&&!confirm('السعر أقل من التكلفة. هل تريد اعتماده؟'))return;if(commit(s=>Object.assign(s.products.find(p=>p.id===calcId),{costs:calcData.costs,price:calcData.r.sale,complete:true})))toast('تم اعتماد السعر والتكاليف');}
function bundles(){return head('قيمة أكبر، في باندل.','اجمع منتجاتك في عرض واحد مع متابعة تكلفة كل قطعة.',`<button class="primary" onclick="bundleForm()">＋ باندل جديد</button>`)+`<div class="notice">الباندل لا يملك مخزونًا منفصلًا. عند تسليم الطلب، تُخصم مكوناته من المنتجات الأصلية تلقائيًا.</div>${state.bundles.length?`<div class="bundle-grid">${state.bundles.map(b=>`<article class="bundle-card"><div class="bundle-icon">${icon('bundle')}</div><h2>${esc(b.name)}</h2>${b.components.some(c=>getp(c.id).archived)?'<div class="notice warn">به مكون مؤرشف؛ غير متاح للطلبات الجديدة.</div>':''}<div class="stack">${b.components.map(c=>`<div class="row between"><span class="muted">${esc(getp(c.id).name)}</span><b>× ${c.qty}</b></div>`).join('')}</div><div class="bundle-price">${egp(b.price)}</div><div class="item"><span>التكلفة</span><b>${egp(bundleCost(b))}</b></div><div class="item"><span>الربح ${bundleComplete(b)?'':'(غير مكتمل)'}</span><b class="${b.price<bundleCost(b)?'danger':''}">${egp(b.price-bundleCost(b))}</b></div><div class="item"><span>متاح للتجميع</span><b>${bundleStock(b)}</b></div><div class="actions"><button class="small" onclick="bundleForm('${b.id}')">تعديل</button></div></article>`).join('')}</div>`:empty('ابدأ بأول باندل','مثل كارت + ميدالية، أو باقة ستاندات.')}`;}
function componentRow(c={}){return `<div class="split-line"><select class="component-product" aria-label="المنتج">${state.products.filter(p=>!p.archived||p.id===c.id).map(p=>`<option value="${p.id}" ${p.id===c.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><input class="component-qty" aria-label="الكمية" type="number" min="1" step="1" required value="${c.qty||1}"><button type="button" aria-label="إزالة المكون" onclick="this.parentNode.remove()">×</button></div>`;}
function bundleForm(id){let b=state.bundles.find(b=>b.id===id);if(!state.products.length)return toast('أضف منتجات أولًا');modal(b?'تعديل الباندل':'إنشاء باندل',`<div class="fields">${field('اسم الباندل','name',b?.name||'','text','required maxlength="120"')}${nf('سعر الباندل النهائي','price',b?.price||0)}</div><h3 style="margin-top:25px">مكونات الباندل</h3><div id="components">${(b?.components||[{}]).map(componentRow).join('')}</div><button type="button" class="small" onclick="$('#components').insertAdjacentHTML('beforeend',componentRow())">＋ مكون آخر</button>${formFooter()}`,f=>{const map={};$$('#components .split-line').forEach(row=>{const id=row.querySelector('select').value;map[id]=(map[id]||0)+Number(row.querySelector('input').value);});const components=Object.entries(map).map(([id,qty])=>({id,qty}));if(!components.length)throw Error('أضف مكونًا واحدًا على الأقل');const data={name:f.get('name').trim(),price:+f.get('price'),components};if(!data.name)throw Error('أدخل اسم الباندل');if(data.price<sum(components.map(c=>Core.cost(getp(c.id))*c.qty))&&!confirm('سعر الباندل أقل من التكلفة. متابعة؟'))return;if(commit(s=>{if(b)Object.assign(s.bundles.find(x=>x.id===id),data);else s.bundles.push({...data,id:uid()});})){closeModal();render();toast('تم حفظ الباندل');}});}
function stock(){return head('المخزون','كل قطعة لها حركة. وكل حركة لها سبب.',`<button class="primary" onclick="stockForm()">＋ حركة مخزون</button>`)+`<div class="kpis">${kpi('إجمالي الوحدات',sum(state.products.map(p=>p.stock)),'في جميع المنتجات','stock')}${kpi('قيمة بتكلفة مسجلة',egp(sum(state.products.map(p=>p.stock*Core.cost(p)))),'تشمل بنود التكلفة المدخلة','wallet')}${kpi('منتجات منخفضة',activeProducts().filter(p=>p.stock<=p.min).length,'عند حد التنبيه أو أقل','box')}${kpi('حركات مسجلة',state.movements.length,'توريد وتسليم وتسويات','orders')}</div><section class="panel"><h2>الرصيد الحالي</h2><div class="table-wrap"><table><thead><tr><th>المنتج</th><th>المتاح فعليًا</th><th>حد التنبيه</th><th>الحالة</th><th></th></tr></thead><tbody>${state.products.map(p=>`<tr><td>${esc(p.name)}</td><td><b>${p.stock}</b></td><td>${p.min}</td><td><span class="badge ${p.stock<=p.min?'warn':''}">${p.stock===0?'نفد / لم يُسجّل':p.stock<=p.min?'منخفض':'متوفر'}</span></td><td><button class="small" onclick="stockForm('${p.id}')">تسجيل حركة</button></td></tr>`).join('')}</tbody></table></div><p style="font-size:11px">الطلبات الجديدة لا تحجز مخزونًا. التحقق والخصم عند التسليم فقط.</p></section><section class="panel" style="margin-top:22px"><h2>سجل الحركات</h2>${state.movements.length?`<div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>المنتج</th><th>الحركة</th><th>السبب</th></tr></thead><tbody>${state.movements.slice().reverse().map(m=>`<tr><td>${date(m.date)}</td><td>${esc(getp(m.productId)?.name)}</td><td dir="ltr">${m.qty>0?'+':''}${m.qty}</td><td>${esc(m.reason)}</td></tr>`).join('')}</tbody></table></div>`:empty('لا توجد حركات بعد')}</section>`;}
function stockForm(id){modal('تسجيل حركة مخزون',`<div class="fields"><label class="field full">المنتج<select name="id">${state.products.map(p=>`<option value="${p.id}" ${p.id===id?'selected':''}>${esc(p.name)} — ${p.stock} قطعة</option>`).join('')}</select></label><label class="field">نوع الحركة<select name="type"><option value="add">إضافة / توريد / رصيد افتتاحي</option><option value="remove">خصم / تالف / تسوية</option></select></label>${nf('الكمية','qty',1,'step="1"')}<label class="field full">السبب<input name="reason" required maxlength="150" placeholder="مثال: رصيد افتتاحي أو شراء من المورد"></label></div>${formFooter('تسجيل الحركة')}`,f=>{const qty=+f.get('qty')*(f.get('type')==='add'?1:-1),pid=f.get('id');if(!Number.isSafeInteger(qty)||!qty)throw Error('أدخل عددًا صحيحًا أكبر من صفر');if(commit(s=>{let p=s.products.find(p=>p.id===pid);if(p.stock+qty<0)throw Error('لا يمكن أن يصبح المخزون سالبًا');p.stock+=qty;s.movements.push({id:uid(),productId:pid,qty,reason:f.get('reason'),date:now()});})){closeModal();render();toast('تم تحديث المخزون');}});}
function orderTable(list){return `<div class="table-wrap"><table><thead><tr><th>الطلب / العميل</th><th>الإجمالي</th><th>المتبقي</th><th>الحالة</th><th></th></tr></thead><tbody>${list.map(o=>`<tr><td><b>${esc(o.customer)}</b><span class="sku">${esc(o.number)} · ${date(o.date)}</span></td><td>${egp(o.total)}</td><td>${o.status==='cancelled'?'—':egp(o.total-o.paid)}</td><td><span class="badge ${o.status==='cancelled'?'bad':o.status==='delivered'?'':'warn'}">${status[o.status]}</span></td><td><button class="small" onclick="orderDetail('${o.id}')">التفاصيل</button></td></tr>`).join('')}</tbody></table></div>`;}
function orders(){return head('طلباتك','من أول تواصل لحد التسليم والتحصيل.',`<button class="primary" onclick="orderForm()">＋ طلب جديد</button>`)+`<section class="panel"><div class="row between"><h2>سجل الطلبات</h2><input class="search" placeholder="بحث بالعميل أو رقم الطلب…" aria-label="بحث الطلبات" oninput="$$('#content tbody tr').forEach(r=>r.hidden=!r.textContent.includes(this.value))"></div>${state.orders.length?orderTable(state.orders.slice().reverse()):empty('أضف أول طلب','لن يُخصم المخزون إلا عند تأكيد التسليم.')}</section>`;}
function orderRow(){return `<div class="split-line"><select class="order-item" aria-label="المنتج أو الباندل" onchange="quotePreview()">${activeProducts().map(p=>`<option value="p:${p.id}">${esc(p.name)} — ${egp(p.price)}</option>`).join('')}${activeBundles().map(b=>`<option value="b:${b.id}">باندل: ${esc(b.name)} — ${egp(b.price)}</option>`).join('')}</select><input class="order-qty" aria-label="كمية الطلب" type="number" min="1" step="1" required value="1" oninput="quotePreview()"><button type="button" aria-label="إزالة البند" onclick="this.parentNode.remove();quotePreview()">×</button></div>`;}
function draftLines(){return $$('#order-lines .split-line').map(row=>{const [t,id]=row.querySelector('select').value.split(':'),x=t==='p'?getp(id):state.bundles.find(b=>b.id===id);return {name:x.name,qty:+row.querySelector('input').value,price:x.price,cost:t==='p'?Core.cost(x):bundleCost(x),complete:t==='p'?x.complete:bundleComplete(x),components:t==='p'?[{id,qty:1}]:structuredClone(x.components)};});}
function quotePreview(){const lines=draftLines(),d=+$('#order-discount').value,total=Core.round(sum(lines.map(l=>l.price*l.qty))*(1-d/100)),cost=sum(lines.map(l=>l.cost*l.qty));$('#quote-preview').textContent=`الإجمالي: ${egp(total)} · الربح التقديري: ${egp(total-cost)}`;}
function orderForm(){if(!activeProducts().length)return toast('أضف منتجًا نشطًا أولًا');modal('طلب جديد',`<div class="fields">${field('اسم العميل','customer','','text','required maxlength="120"')}${field('رقم الهاتف','phone','','tel','maxlength="40"')}</div><h3 style="margin-top:25px">المنتجات والباندلز</h3><div id="order-lines">${orderRow()}</div><button type="button" class="small" onclick="$('#order-lines').insertAdjacentHTML('beforeend',orderRow());quotePreview()">＋ بند آخر</button><div class="fields" style="margin-top:20px">${nf('خصم إضافي على الطلب %','discount',0,'max="100" id="order-discount" oninput="quotePreview()"')}${nf('المدفوع / العربون','paid',0)}<label class="field full">ملاحظات التخصيص / العنوان<textarea name="notes" maxlength="1500" placeholder="الاسم المطلوب طباعته، اللون، المقاس، عنوان التسليم…"></textarea></label></div><div class="notice" id="quote-preview" style="margin-top:20px"></div><p style="font-size:11px">السعر من الكتالوج؛ راجعه في التسعير قبل إنشاء الطلب. تكلفة الطلب تُحفظ لحظة إنشائه.</p>${formFooter('حفظ الطلب')}`,f=>{const lines=draftLines(),discount=+f.get('discount'),total=Core.round(sum(lines.map(l=>l.price*l.qty))*(1-discount/100)),paid=+f.get('paid');if(!lines.length)throw Error('أضف بندًا للطلب');if(lines.some(l=>!l.complete))throw Error('راجع تكاليف المنتجات واعتمدها قبل إنشاء طلب');if(lines.some(l=>l.price<=0))throw Error('حدد سعر بيع للمنتجات أولًا');if(paid>total)throw Error('المدفوع أكبر من قيمة الطلب');if(total<sum(lines.map(l=>l.cost*l.qty))&&!confirm('الطلب بخسارة حسب التكاليف المسجلة. متابعة؟'))return;if(commit(s=>s.orders.push({id:uid(),number:'AX-'+String(s.orders.length+1).padStart(4,'0'),customer:f.get('customer').trim(),phone:f.get('phone'),notes:f.get('notes'),lines,total,discount,paid,status:'new',date:now()}))){closeModal();render();toast('تم حفظ الطلب');}});quotePreview();}
function orderDetail(id){const o=state.orders.find(o=>o.id===id);modal(o.number+' — '+o.customer,`<div class="row between"><span class="badge">${status[o.status]}</span><span class="muted">${date(o.date)}</span></div><p>${esc(o.phone)}</p><div class="table-wrap"><table><thead><tr><th>البند</th><th>الكمية</th><th>سعر الوحدة</th></tr></thead><tbody>${o.lines.map(l=>`<tr><td>${esc(l.name)}</td><td>${l.qty}</td><td>${egp(l.price)}</td></tr>`).join('')}</tbody></table></div><div class="item"><span>الخصم</span><b>${o.discount}%</b></div><div class="item"><span>الإجمالي</span><b>${egp(o.total)}</b></div><div class="item"><span>المدفوع ${o.status==='cancelled'?'(سجل تاريخي)':''}</span><b>${egp(o.paid)}</b></div><div class="item"><span>المتبقي</span><b>${o.status==='cancelled'?'—':egp(o.total-o.paid)}</b></div><p>${esc(o.notes)}</p>${o.status==='cancelled'?'<div class="notice warn">إذا استلمت مبالغ، راجع ردّها للعميل خارج التطبيق. الإلغاء لا ينفّذ تحويلًا ماليًا.</div>':''}<div class="actions">${o.status==='new'?`<button type="button" onclick="changeStatus('${id}','preparing')">بدء التجهيز</button>`:''}${!['delivered','cancelled'].includes(o.status)?`<button type="button" class="primary" onclick="changeStatus('${id}','delivered')">تأكيد التسليم وخصم المخزون</button>`:''}${o.status!=='cancelled'&&o.paid<o.total?`<button type="button" onclick="paymentForm('${id}')">＋ تسجيل دفعة</button>`:''}<button type="button" onclick="printOrder('${id}')">طباعة ملخص</button>${o.status!=='cancelled'?`<button type="button" class="danger" onclick="changeStatus('${id}','cancelled')">${o.status==='delivered'?'مرتجع كامل وإعادة المخزون':'إلغاء الطلب'}</button>`:''}</div>`,()=>{});}
function changeStatus(id,statusTo){if(statusTo==='cancelled'&&!confirm('تأكيد الإلغاء؟ إذا كان الطلب مُسلّمًا سيعود كل المخزون. تأكد من استلام المرتجع فعليًا.'))return;if(commit(s=>{const o=s.orders.find(o=>o.id===id);if(statusTo==='delivered')Core.deliver(s,o);else if(statusTo==='cancelled')Core.cancel(s,o);else if(o.status==='new')o.status='preparing';else throw Error('انتقال غير متاح');})){closeModal();render();toast('تم تحديث الطلب');}}
function paymentForm(id){const o=state.orders.find(o=>o.id===id);closeModal();modal('تسجيل دفعة — '+o.number,`<p>المتبقي: ${egp(o.total-o.paid)}</p>${nf('قيمة الدفعة','amount',o.total-o.paid)}${formFooter('تسجيل الدفعة')}`,f=>{const amount=+f.get('amount');if(amount<=0||amount>o.total-o.paid)throw Error('الدفعة يجب أن تكون أكبر من صفر ولا تتجاوز المتبقي');if(commit(s=>{const x=s.orders.find(o=>o.id===id);x.paid=Core.round(x.paid+amount);})){closeModal();render();toast('تم تسجيل الدفعة');}});}
function printOrder(id){const o=state.orders.find(o=>o.id===id);$('#print-area').innerHTML=`<img src="${state.logo||DEFAULT_LOGO}" alt="Airix" style="width:150px;height:auto"><h2>ملخص طلب ${esc(o.number)}</h2><p>${esc(o.customer)} · ${esc(o.phone)} · ${date(o.date)}</p><table><tr><th>المنتج</th><th>الكمية</th><th>سعر الوحدة</th><th>الإجمالي</th></tr>${o.lines.map(l=>`<tr><td>${esc(l.name)}</td><td>${l.qty}</td><td>${egp(l.price)}</td><td>${egp(l.price*l.qty)}</td></tr>`).join('')}</table><p>الخصم: ${o.discount}%</p><h2>الإجمالي: ${egp(o.total)}</h2><p>المدفوع: ${egp(o.paid)} · المتبقي: ${egp(o.total-o.paid)}</p><p>الحالة: ${status[o.status]}</p><p>${esc(o.notes)}</p><p>ملخص طلب — ليس فاتورة ضريبية</p>`;window.print();}
function expenses(){return head('المصروفات','سجّل المصروفات العامة غير المحسوبة ضمن تكلفة المنتجات.',`<button class="primary" onclick="expenseForm()">＋ مصروف جديد</button>`)+`<div class="notice warn">لتجنب خصم المصروف مرتين: لو وزّعت التسويق أو الشحن على تكلفة الوحدة، لا تسجّل نفس المبلغ هنا. استخدم الصفحة للمصروفات الإضافية فقط.</div><div class="kpis">${kpi('إجمالي المصروفات',egp(sum(state.expenses.map(e=>e.amount))),'منذ بداية التسجيل','wallet')}</div><section class="panel">${state.expenses.length?`<div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>الوصف</th><th>المبلغ</th><th></th></tr></thead><tbody>${state.expenses.slice().reverse().map(e=>`<tr><td>${date(e.date)}</td><td>${esc(e.name)}</td><td>${egp(e.amount)}</td><td><button class="small danger" onclick="removeExpense('${e.id}')">حذف</button></td></tr>`).join('')}</tbody></table></div>`:empty('لم تُسجل مصروفات إضافية')}</section>`;}
function expenseForm(){modal('مصروف إضافي',`<div class="fields">${field('الوصف','name','','text','required maxlength="150"')}${nf('المبلغ','amount',0)}${field('التاريخ','date',new Date().toISOString().slice(0,10),'date','required')}</div>${formFooter()}`,f=>{if(+f.get('amount')<=0)throw Error('أدخل مبلغًا أكبر من صفر');if(commit(s=>s.expenses.push({id:uid(),name:f.get('name'),amount:+f.get('amount'),date:new Date(f.get('date')+'T12:00:00').toISOString()}))){closeModal();render();toast('تم حفظ المصروف');}});}
function removeExpense(id){if(confirm('حذف هذا المصروف؟')&&commit(s=>s.expenses=s.expenses.filter(e=>e.id!==id)))render();}
function settings(){return head('مساحة عملك، بطريقتك.','الهوية والبيانات والنسخ الاحتياطي.')+`<div class="grid equal"><section class="panel"><h2>هوية Airix</h2><p>اللوجو الأصلي مدمج في التطبيق. يمكنك رفع بديل له. PNG أو JPG أو WebP بحد أقصى 500 كيلوبايت.</p><div class="logo-preview" style="margin:20px 0"><div class="brand">${`<img src="${state.logo||DEFAULT_LOGO}" alt="Airix">`}</div></div><label class="field">رفع الشعار<input type="file" accept="image/png,image/jpeg,image/webp" onchange="uploadLogo(this.files[0])"></label><div class="actions"><button onclick="if(commit(s=>s.logo=''))render()">استعادة اللوجو الأصلي</button></div></section><section class="panel"><h2>نسخة احتياطية كاملة</h2><p>تشمل المنتجات والباندلز والطلبات والمخزون والمصروفات والشعار. احفظها دوريًا خارج المتصفح.</p><div class="actions"><button class="primary" onclick="backup()">↓ تصدير البيانات JSON</button><button onclick="exportCSV()">تصدير المنتجات CSV</button></div><p style="margin-top:20px">${state.backupAt?'آخر تصدير: '+date(state.backupAt):'لم تُصدّر نسخة بعد.'}</p><label class="field" style="margin-top:20px">استعادة نسخة JSON<input type="file" accept=".json,application/json" onchange="restore(this.files[0]);this.value='' "></label><p style="font-size:11px">الاستعادة تستبدل البيانات الحالية بعد التأكيد. لا يوجد دمج تلقائي.</p>${loadError?'<button onclick="download(localStorage.getItem(KEY),\'airix-recovery.json\',\'application/json\')">تنزيل البيانات المتعذرة للإنقاذ</button>':''}</section></div><section class="panel"><h2>عن هذه النسخة</h2><div class="notice">حفظ محلي على نفس المتصفح والجهاز. لا يوجد تسجيل دخول أو مزامنة سحابية. رابط الموقع لا ينقل بياناتك للأجهزة الأخرى. حذف بيانات المتصفح يحذف السجلات، لذلك احتفظ بنسخة احتياطية.</div><p>العملة: الجنيه المصري · الإصدار 1.0 · تعمل بدون خدمات خارجية</p><p>جاهزة لاستضافة ملفات ثابتة على Vercel. ربط قاعدة بيانات وتسجيل دخول خطوة منفصلة إذا احتجت المزامنة لاحقًا.</p></section>`;}
function renderBrand(){$('#brand').innerHTML=`<img src="${state.logo||DEFAULT_LOGO}" alt="Airix">`;}
function uploadLogo(file){if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>500000)return toast('اختر PNG أو JPG أو WebP أصغر من 500 كيلوبايت');const reader=new FileReader();reader.onload=()=>{if(commit(s=>s.logo=reader.result)){render();toast('تم تحديث الشعار');}};reader.readAsDataURL(file);}
function download(data,name,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);}
function backup(){const snapshot=structuredClone(state);snapshot.backupAt=now();download(JSON.stringify(snapshot,null,2),'airix-backup-'+new Date().toISOString().slice(0,10)+'.json','application/json');if(commit(s=>s.backupAt=snapshot.backupAt)){render();toast('تم تجهيز النسخة للتحميل');}}
async function restore(file){if(!file)return;try{if(file.size>15000000)throw Error('الملف أكبر من الحجم المسموح');const s=validate(JSON.parse(await file.text()));if(!confirm(`استبدال البيانات الحالية بـ ${s.products.length} منتجات و${s.orders.length} طلبات؟ صدّر نسختك الحالية أولًا.`))return;localStorage.setItem(KEY,JSON.stringify(s));state=s;loadError=false;render();toast('تمت الاستعادة');}catch(e){toast('تعذرت الاستعادة: '+e.message);}}
function exportCSV(){const cell=x=>'"'+String(x??'').replace(/^[=+@\-]/,"'$&").replace(/"/g,'""')+'"',rows=[['الكود','المنتج',...COST_LABELS,'إجمالي التكلفة','سعر البيع','المخزون','التكلفة مراجَعة'],...state.products.map(p=>[p.sku,p.name,...p.costs,Core.cost(p),p.price,p.stock,p.complete?'نعم':'لا'])];download('\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n'),'airix-products.csv','text/csv;charset=utf-8');}
const navItems=[['home','home','نظرة عامة'],['pricing','calc','حاسبة التسعير'],['products','box','المنتجات'],['bundles','bundle','الباندلز'],['stock','stock','المخزون'],['orders','orders','الطلبات'],['expenses','wallet','المصروفات'],['settings','settings','الإعدادات والنسخ']];
$('#nav').innerHTML=navItems.map(([id,i,title])=>`<button data-nav="${id}" onclick="nav('${id}')">${icon(i)}${title}</button>`).join('');$('#today').textContent=new Date().toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric'});render();

function nextSKU(){let i=1;while(state.products.some(p=>p.sku==='AX-'+String(i).padStart(3,'0')))i++;return 'AX-'+String(i).padStart(3,'0');}
function productUsed(s,id){return s.products.find(p=>p.id===id)?.stock>0||s.movements.some(m=>m.productId===id)||s.bundles.some(b=>b.components.some(c=>c.id===id))||s.orders.some(o=>o.lines.some(l=>l.components.some(c=>c.id===id)));}
function deleteProduct(id){const p=getp(id);if(!p)return;const used=productUsed(state,id);if(!confirm(used?'هذا المنتج له رصيد أو سجلات مرتبطة. سيتم أرشفته وإخفاؤه من الطلبات الجديدة، مع الاحتفاظ بكل السجلات. متابعة؟':'حذف المنتج نهائيًا؟ لا توجد سجلات أو كميات مرتبطة به.'))return;if(commit(s=>{if(productUsed(s,id))s.products.find(p=>p.id===id).archived=true;else s.products=s.products.filter(p=>p.id!==id);})){render();toast(used?'تمت الأرشفة. يمكنك استعادته من عرض المؤرشف.':'تم حذف المنتج');}}
function restoreProduct(id){if(commit(s=>s.products.find(p=>p.id===id).archived=false)){render();toast('تمت استعادة المنتج');}}
function duplicateProduct(id){const p=getp(id),sku=nextSKU(),newId=uid();if(commit(s=>s.products.push({...structuredClone(p),id:newId,sku,name:p.name+' — نسخة',stock:0,archived:false}))){render();productForm(newId);toast('تم نسخ المنتج برصيد صفر وكود جديد');}}
</script></body></html>
